          feature/goteborg-open-plans-v0.6|b6f178833ca451f33a8ef8d75da42482378ea432|f272e1ea810331f37ab568ef0cbb98abd9bf2989|5
          feature/rapportera-router-v0.7|b3ccf124de823081e92951f2048e6e5c731fecbd|dd2ff270cfc87cd63994d8078b34f5e212a72afa|6
