name: One-time archived legacy branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Delete only Box-archived merged legacy refs
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected_head merged_commit pr; do
            [ -n "$branch" ] || continue
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "Already absent: $branch"
              continue
            fi
            actual="$(git rev-parse "$ref")"
            if [ "$actual" != "$expected_head" ]; then
              echo "::error::Refusing $branch: head moved ($actual != $expected_head)"
              exit 1
            fi
            if ! git cat-file -e "$merged_commit^{commit}"; then
              echo "::error::Refusing $branch: archived merge commit missing: $merged_commit"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$merged_commit" origin/main; then
              echo "::error::Refusing $branch: merge/squash commit is not in current main"
              exit 1
            fi
            echo "PR #$pr archived in Box; deleting verified legacy ref $branch"
            git push origin --delete "$branch"
          done <<'EOF'
          design/swedish-civic-v0.3.5|e91cda99bfff0ebb1fa307e07e557564e742fa4c|e82497df73ffa841ab5ed3e5134d663828c9162b|1
          feature/riksdagen-beslut-v0.4|0b22a6edb7da2ccafeb68ceafae1559b98d115ad|ed75eddde57d7ec92897a0ca1136100138c2cd2a|2
