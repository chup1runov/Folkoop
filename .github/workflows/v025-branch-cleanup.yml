name: One-time v025 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v025-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify squash ancestry and delete merged ref
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          branch='feature/google-oauth-scaffold-v025'
          expected_head='7f2e0f261c4026a242eb65084d7b17aacb71644c'
          squash_commit='2fdf5f4f0324b21adc1478558c26e8f98f0c1c39'
          ref="refs/remotes/origin/$branch"
          test "$(git rev-parse "$ref")" = "$expected_head"
          git merge-base --is-ancestor "$squash_commit" origin/main
          git push origin ":refs/heads/$branch"
