name: One-time obsolete branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Delete final verified temporary branch
        run: |
          set -euo pipefail
          branch='housekeeping/remove-public-gmail-2026-09-28'
          ref="refs/remotes/origin/$branch"
          if ! git show-ref --verify --quiet "$ref"; then
            echo "Already absent: $branch"
            exit 0
          fi
          base="$(git merge-base "$ref" origin/main)"
          changed="$(git diff --name-only "$base" "$ref")"
          test -n "$changed"
          while IFS= read -r path; do
            test -n "$path" || continue
            branch_blob="$(git rev-parse "$ref:$path")"
            main_blob="$(git rev-parse "origin/main:$path")"
            if [ "$branch_blob" != "$main_blob" ]; then
              echo "::error::Refusing to delete $branch: $path differs from main"
              exit 1
            fi
          done <<< "$changed"
          echo "All branch-introduced blobs are already identical in main; deleting $branch"
          git push origin --delete "$branch"
