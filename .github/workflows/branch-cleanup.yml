name: One-time obsolete branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Delete verified temporary housekeeping branches
        env:
          BRANCHES: >-
            housekeeping-remove-public-gmail-2026-09-28
            housekeeping/remove-public-gmail-2026-09-28
        run: |
          set -euo pipefail
          for branch in $BRANCHES; do
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "Already absent: $branch"
              continue
            fi
            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "Deleting ancestor branch: $branch"
              git push origin --delete "$branch"
            elif git diff --quiet origin/main "$ref" -- . ':(exclude).github/workflows/branch-cleanup.yml'; then
              echo "Deleting branch equivalent except for this temporary workflow: $branch"
              git push origin --delete "$branch"
            else
              echo "::error::Refusing to delete $branch: unique content remains"
              exit 1
            fi
          done
