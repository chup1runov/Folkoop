name: Idag audit preparation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'feature/idag-audit-v0.11'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Export exact source and probe public daily sources
        run: |
          mkdir -p audit-output
          git archive --format=tar HEAD > audit-output/source.tar
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const urls = {
            forecast:'https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/11.97/lat/57.71/data.json',
            warnings:'https://opendata-download-warnings.smhi.se/ibww/api/version/1/warning.json',
            smhiDocs:'https://opendata.smhi.se/metfcst/snow1gv1',
            vasttrafik:'https://www.vasttrafik.se/reseplanering/',
            tickets:'https://www.vasttrafik.se/biljetter/mer-om-biljetter/vasttrafik-to-go/',
            water:'https://goteborg.se/wps/portal?uri=gbglnk%3Agbg.page.ba05e5bd-3b49-4a13-a949-3fc87842665c'
          };
          const status = await Promise.all(Object.entries(urls).map(async ([name,url])=>{
            try {
              const r=await fetch(url,{signal:AbortSignal.timeout(20000),headers:{Origin:'https://chup1runov.github.io'}});
              const text=await r.text();
              await writeFile(`audit-output/${name}.txt`,text);
              return {name,url,finalUrl:r.url,status:r.status,type:r.headers.get('content-type'),cors:r.headers.get('access-control-allow-origin'),bytes:text.length};
            } catch(e){return {name,url,error:e.message};}
          }));
          await writeFile('audit-output/status.json',JSON.stringify(status,null,2));
          console.log(JSON.stringify(status,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: idag-audit-source
          path: audit-output/
          retention-days: 2
