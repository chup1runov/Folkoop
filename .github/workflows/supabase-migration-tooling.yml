name: Supabase migration tooling
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-migration-tooling.yml'
      - 'supabase/migrations/**'
      - 'supabase/tests/network-economic-flow-prototype.sql'
      - 'supabase/tests/network-economic-flow-migration.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Verify pinned CLI and migration command
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.117.0"
          supabase migration --help >/dev/null
          supabase migration new --help >/dev/null
      - name: Generate E01 migration filename with the CLI
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/supabase/migrations"
          cd "$tmp"
          supabase migration new folkoop_economic_flow_v0
          mapfile -t generated < <(find supabase/migrations -maxdepth 1 -type f -name '*_folkoop_economic_flow_v0.sql' -printf '%f\n')
          test "${#generated[@]}" -eq 1
          [[ "${generated[0]}" =~ ^[0-9]{14}_folkoop_economic_flow_v0\.sql$ ]]
          echo "CLI_GENERATED_MIGRATION=${generated[0]}"
