name: Network authorization tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: folkoop_test
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations and run database authorization tests
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/test-database.sh
