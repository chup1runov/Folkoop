name: One-time merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/merged-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and delete merged product branch
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          branch='product/folkoop-concept-v1'
          expected='664ac307b97ae04484b3e8d8905a212f47525a72'
          ref="refs/remotes/origin/$branch"
          test "$(git rev-parse "$ref")" = "$expected"
          git diff --quiet origin/main "$ref"
          git push origin ":refs/heads/$branch"
