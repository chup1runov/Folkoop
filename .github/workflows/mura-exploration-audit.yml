name: Mura exploration audit (no deploy)
on:
  push:
    branches: [qa/mura-systematic-20261003]
    paths: ['tests/audit/**', '.github/workflows/mura-exploration-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mura-exploration-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Audit ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser runtime
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Build unchanged runtime
        run: |
          git diff --exit-code c1a3dc8ef8d907a43809b78b975805ab015ef93b HEAD -- apps/web
          python -m py_compile tests/audit/*.py
          node scripts/build/build-site.mjs
      - name: Independent exception triage
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          BASE_URL: http://127.0.0.1:4173/Folkoop/
          QA_OUTPUT: qa-triage
        run: |
          mkdir -p /tmp/folkoop-audit-root
          ln -s "$PWD/_site" /tmp/folkoop-audit-root/Folkoop
          python -m http.server 4173 --bind 127.0.0.1 --directory /tmp/folkoop-audit-root > /tmp/folkoop-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "$BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          python tests/audit/triage.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mura-triage-${{ matrix.engine }}
          path: qa-triage/${{ matrix.engine }}/
          retention-days: 14
          if-no-files-found: warn
