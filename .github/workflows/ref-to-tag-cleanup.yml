name: One-time convert historical refs to tags
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ref-to-tag-cleanup.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch refs and tags
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - name: Create verified archival tags and delete branch refs
        run: |
          set -euo pipefail

          archive_branch='archive/sverinav-v0.14-before-folkoop'
          archive_sha='09e29aad3cad3b9d3ee4403881e02ac4b9022073'
          archive_tag='archive/sverinav-v0.14-before-folkoop'

          air_branch='feature/goteborg-air-quality-v0.6'
          air_sha='4eee2e068f42d914762ba5be567e2b2f43774640'
          air_tag='archive/experiment-goteborg-air-quality-v0.6'

          verify_branch() {
            branch="$1"
            expected="$2"
            ref="refs/remotes/origin/$branch"
            test "$(git rev-parse "$ref")" = "$expected"
          }

          ensure_tag() {
            tag="$1"
            expected="$2"
            message="$3"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "refs/tags/$tag^{}")" = "$expected"
            else
              git tag -a "$tag" "$expected" -m "$message"
              git push origin "refs/tags/$tag"
              git fetch origin "refs/tags/$tag:refs/tags/$tag"
              test "$(git rev-parse "refs/tags/$tag^{}")" = "$expected"
            fi
          }

          verify_branch "$archive_branch" "$archive_sha"
          verify_branch "$air_branch" "$air_sha"

          ensure_tag "$archive_tag" "$archive_sha" 'Sverinav v0.14 checkpoint immediately before FOLKOOP migration'
          ensure_tag "$air_tag" "$air_sha" 'Blocked Göteborg air-quality WMS experiment preserved for possible future retry'

          git push origin --delete "$archive_branch"
          git push origin --delete "$air_branch"
