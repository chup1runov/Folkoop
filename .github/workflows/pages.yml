name: Validate and deploy FOLKOOP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}"
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax, versions, assets and deterministic regression tests
        run: |
          for file in *.js scripts/*.mjs; do node --check "$file"; done
          python -m py_compile tests/browser.py
          node scripts/static-smoke.mjs
          node --test tests/*.test.mjs
      - name: Install pinned browser test driver
        run: python -m pip install 'playwright==1.57.0'
      - name: Prepare static browser test build
        run: node scripts/build-site.mjs
      - name: Browser interactions at actual project subpath
        run: bash scripts/browser-smoke.sh
      - name: Fetch Riksdagen once
        run: node scripts/fetch-riksdagen.mjs
      - name: Fetch Gothenburg consultations once
        run: node scripts/fetch-goteborg-open-plans.mjs
      - name: Validate normalized live feeds
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import './civic-core.js';
          for(const [file,id,hosts] of [['riksdagen-decisions','riksdagen_open_data',['data.riksdagen.se']],['goteborg-open-plans','goteborg_open_plans',['goteborg.se','www.goteborg.se']]]){
            const p=JSON.parse(await readFile(`data/${file}.json`,'utf8'));
            SverinavCore.feed(p,id,hosts);
            console.log(`${id}: ${p.items.length} validated records`);
          }
          JS
      - name: Final artifact with the same tested static files
        run: node scripts/build-site.mjs
      - name: Retain QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: qa-output/
          retention-days: 7
      - name: Upload single production artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check direct SMHI browser contracts
        run: node scripts/probe-daily.mjs
      - name: Check live road-holder service
        if: always()
        run: node scripts/probe-netinfo.mjs
      - name: Check official report handoffs
        if: always()
        run: node scripts/probe-report-routes.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact without fetching or rebuilding
        id: deployment
        uses: actions/deploy-pages@v4
