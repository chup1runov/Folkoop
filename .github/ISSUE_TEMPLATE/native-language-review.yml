name: Native-language review of FOLKOOP
description: Request or document a real human review of one of the 11 localized UI versions (not an automatic approval).
title: "[i18n native review] "
body:
  - type: markdown
    attributes:
      value: |
        This is a review/evidence workflow, not a claim that the language has passed. Please do not publish email addresses, identity documents, participant messages, private data or passwords. A public alias is sufficient when consented. The full bilingual CSV is generated by `npm run i18n:export-review` and attached to the validate CI artifact.
  - type: dropdown
    id: locale
    attributes:
      label: Reviewed language
      description: Choose the exact language. For ku use Latin Kurmanji, not Sorani; bs is Bosnian Latin, not proof of Croatian or Serbian acceptability.
      options:
        - ar — Modern Standard Arabic
        - fa — Persian
        - so — Somali
        - ku — Kurmanji (Latin)
        - sv — Swedish
        - en — English
        - ru — Russian
        - uk — Ukrainian
        - es — Spanish
        - fi — Finnish
        - bs — Bosnian (Latin)
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Native language, script and regional variety
      placeholder: e.g. Arabic MSA, Somali dialect, Kurmanji Latin
    validations:
      required: true
  - type: input
    id: review_snapshot
    attributes:
      label: Reviewed FOLKOOP commit or branch
      placeholder: 40-character commit SHA and/or a PR link
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Review corpus SHA-256
      description: Copy from qa-output/native-review/review-inventory.json; approval must match the current source.
      placeholder: sha256
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Review scope
      options:
        - Request a reviewer (not started)
        - Partial review (not yet certifiable)
        - Complete exported corpus and all required routes
    validations:
      required: true
  - type: textarea
    id: test_routes
    attributes:
      label: Screens, nested dialogs, accessibility and devices examined
      description: Include Home, Together, Projects, Messages, People, Communities, City, Center, Me, Settings, About, plus Mura/guest, account, forms, confirmations, privacy, age/consent, RTL and City iframe where relevant.
      placeholder: Tested routes and devices, plus any explicit exclusions
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings with exact key, severity and suggested wording
      description: P0 misleading consent/security/operation; P1 meaning; P2 usability/terminology; P3 optional style. Explain any unresolved issue.
    validations:
      required: true
  - type: checkboxes
    id: evidence
    attributes:
      label: Evidence prerequisites for human sign-off
      options:
        - label: I personally read and understood the target language and dialect/script (not only machine translation).
        - label: I checked meaning and safety warnings, not only spelling or presence of translated keys.
        - label: I checked the complete exported corpus and all required routes, or explicitly mark this as a partial review.
        - label: I consent to publication of my chosen reviewer alias / GitHub handle only.
