<!doctype html>
<html lang="sv" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174d5b">
  <meta name="description" content="Sverinav — ett enklare gränssnitt till samhället.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sverinav">
  <title>Sverinav — Samhället. Enklare.</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="mark" aria-hidden="true">S</div>
        <div>
          <div class="brand">Sverinav</div>
          <div class="tagline" id="tagline">Samhället. Enklare.</div>
        </div>
      </div>

      <div class="top-actions">
        <label class="visually-hidden" for="languageSelect" id="languageLabel">Språk</label>
        <select id="languageSelect" class="language-select" aria-labelledby="languageLabel">
          <option value="sv">Svenska</option>
          <option value="en">English</option>
          <option value="ar">العربية</option>
          <option value="so">Soomaali</option>
          <option value="fa">فارسی</option>
          <option value="fi">Suomi</option>
        </select>
        <span class="pilot" id="pilotLabel">PILOT</span>
      </div>
    </header>

    <main id="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Huvudmeny" id="bottomNav">
      <button data-screen="home" class="active" id="navHome">Hem</button>
      <button data-screen="nara" id="navNear">Nära</button>
      <button data-screen="rapportera" id="navReport">Rapportera</button>
      <button data-screen="beslut" id="navDecisions">Beslut</button>
    </nav>
  </div>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
