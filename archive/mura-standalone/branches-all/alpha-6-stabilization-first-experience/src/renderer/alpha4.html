<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Mura Companion — Ксюша</title>
  <link rel="stylesheet" href="./alpha4.css" />
</head>
<body>
  <main id="stage" data-interactive="false" data-quiet="false" data-surface-attached="false">
    <div id="bubble" class="bubble" hidden></div>
    <div id="dropHint" class="drop-hint" hidden>Дай это Ксюше</div>

    <section id="onboarding" class="coach" hidden>
      <span class="kicker">ПЕРВОЕ ЗНАКОМСТВО</span>
      <strong id="onboardingTitle"></strong>
      <p id="onboardingText"></p>
      <div id="onboardingActions" class="actions"></div>
    </section>

    <section id="handoff" class="sheet" hidden>
      <span class="kicker">Ты дал Ксюше</span>
      <strong id="handoffName"></strong>
      <small id="handoffMeta"></small>
      <div class="actions">
        <button data-handoff="remember" class="primary">Запомнить</button>
        <button data-handoff="open">Открыть</button>
        <button data-handoff="reveal">Показать</button>
        <button data-handoff="cancel" class="ghost">×</button>
      </div>
    </section>

    <section id="timerSheet" class="sheet compact" hidden>
      <span id="timerTitle" class="kicker">Таймер</span>
      <div class="actions timer-actions">
        <button data-minutes="5">5</button><button data-minutes="15">15</button><button data-minutes="25">25</button><button data-minutes="50">50</button>
      </div>
    </section>

    <section id="characterWrap" class="character-wrap" data-mode="passive">
      <div id="visual" class="visual">
        <img id="body" class="character" draggable="false" alt="Ксюша" />
        <img id="rigHead" class="rig head" draggable="false" alt="" hidden />
        <img id="rigEyes" class="rig eyes" draggable="false" alt="" hidden />
      </div>
      <nav id="radial" class="radial" hidden>
        <button data-command="wave" data-label="Помахать" title="Помахать">👋</button>
        <button data-command="thinking" data-label="Подумать" title="Подумать">💭</button>
        <button data-command="timer" data-label="Таймер" title="Таймер">⏱</button>
        <button data-command="focus" data-label="Фокус" title="Фокус">◎</button>
        <button data-command="home" data-label="Дом" title="Дом">⌂</button>
        <button data-command="perch" data-label="На окно" title="Сесть на окно">▱</button>
        <button data-command="jump" data-label="Прыгнуть" title="Прыгнуть">↑</button>
      </nav>
      <span id="status" class="status"></span>
    </section>
  </main>
  <script src="./alpha4.js"></script>
</body>
</html>
